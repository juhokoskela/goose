name: Publish Docker images

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild the current upstream release even if its image tag exists
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  publish-main:
    name: Publish main
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-main
      cancel-in-progress: true
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/goose

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build and push main
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE_NAME }}:main
          cache-from: type=gha,scope=goose-main
          cache-to: type=gha,mode=max,scope=goose-main

  publish-stable:
    name: Publish latest upstream release
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    concurrency:
      group: docker-stable
      cancel-in-progress: true
    env:
      IMAGE_NAME: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/goose

    steps:
      - name: Checkout Docker scaffolding
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Find latest upstream release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(gh api repos/pressly/goose/releases/latest --jq .tag_name)"
          case "$tag" in
            v[0-9]*) ;;
            *)
              echo "Unexpected upstream release tag: $tag" >&2
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Check for a complete release image
        id: published
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          release_manifest=""
          latest_manifest=""

          if release_manifest="$(docker buildx imagetools inspect "$IMAGE_NAME:$RELEASE_TAG" --format '{{json .Manifest}}' 2>/dev/null)" &&
             latest_manifest="$(docker buildx imagetools inspect "$IMAGE_NAME:latest" --format '{{json .Manifest}}' 2>/dev/null)"; then
            release_platforms="$(jq -cS '
              [.manifests[]?
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                | {architecture: .platform.architecture, digest: .digest}]
              | sort_by(.architecture)
            ' <<< "$release_manifest")"
            latest_platforms="$(jq -cS '
              [.manifests[]?
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64" or .platform.architecture == "arm64")
                | {architecture: .platform.architecture, digest: .digest}]
              | sort_by(.architecture)
            ' <<< "$latest_manifest")"
          fi

          if jq -e 'map(.architecture) == ["amd64", "arm64"]' <<< "${release_platforms:-[]}" >/dev/null &&
             [ "$release_platforms" = "$latest_platforms" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout latest upstream release
        if: steps.published.outputs.complete != 'true' || inputs.force
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pressly/goose
          ref: ${{ steps.release.outputs.tag }}
          path: upstream
          persist-credentials: false

      - name: Add Docker scaffolding
        if: steps.published.outputs.complete != 'true' || inputs.force
        run: cp Dockerfile .dockerignore upstream/

      - name: Build and push latest upstream release
        if: steps.published.outputs.complete != 'true' || inputs.force
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./upstream
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.release.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha,scope=goose-stable
          cache-to: type=gha,mode=max,scope=goose-stable

      - name: Report complete release image
        if: steps.published.outputs.complete == 'true' && !inputs.force
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: echo "$IMAGE_NAME:$RELEASE_TAG and latest contain both required platforms" >> "$GITHUB_STEP_SUMMARY"
